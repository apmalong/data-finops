# One container: `airflow standalone` (SQLite, one process), not the official multi-service
# compose (#66). No AWS credentials here; add compose.aws.yaml for a real run.
services:
  airflow:
    build: .
    command: standalone
    # The container writes dbt's target/ and logs/ and the event files. Docker Desktop bind
    # mounts appear root-owned to the image's airflow user (uid 50000 gets "Permission
    # denied"), so use 0 there; on Linux, your own uid (`id -u`).
    user: "${AIRFLOW_UID:?set AIRFLOW_UID: 0 on Docker Desktop, your uid (id -u) on Linux}:0"
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__OPENLINEAGE__NAMESPACE: reference-airflow
      # The same git-ignored folder dbt-ol writes to (dbt/openlineage.yml).
      AIRFLOW__OPENLINEAGE__TRANSPORT: >-
        {"type": "file", "log_file_path": "/workspace/.local/openlineage/airflow-events.jsonl",
        "append": true}
    volumes:
      # Only what the task needs, at the paths dbt/openlineage.yml expects relative to dbt/.
      - ../dbt:/workspace/examples/reference-workload/dbt
      - ../../../.local/openlineage:/workspace/.local/openlineage
      - ./dags:/opt/airflow/dags:ro
