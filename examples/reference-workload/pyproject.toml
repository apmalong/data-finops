[project]
name = "reference-workload"
version = "0.0.0"
description = "Reference workload for validating data-finops against real billing (ADR 0021). Not part of the data_finops package."
requires-python = ">=3.12"
dependencies = [
    "pulumi>=3,<4",
    "pulumi-aws>=7,<8",
]

[dependency-groups]
dev = [
    "pip-audit>=2,<3",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
