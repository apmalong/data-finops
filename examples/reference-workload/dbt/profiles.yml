# Credentials come from the standard AWS chain (for example AWS_PROFILE); none are stored here.
reference_workload:
  target: reference
  outputs:
    reference:
      type: athena
      region_name: us-east-1
      database: awsdatacatalog
      schema: reference_workload
      work_group: data-finops-reference
      s3_staging_dir: "s3://{{ env_var('REFERENCE_WORKLOAD_BUCKET') }}/athena-results/"
      s3_data_dir: "s3://{{ env_var('REFERENCE_WORKLOAD_BUCKET') }}/tables/"
      threads: 1
