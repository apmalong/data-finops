name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the PR commit range
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Sync dependencies from committed lockfiles
        run: |
          uv sync --extra dev --extra api --extra aws --frozen
          uv sync --frozen --directory examples/reference-workload
      # The same command a contributor runs locally (#241): it stops at the first failure.
      - name: Gates (root and reference workload)
        run: uv run --no-project python -m scripts.gates root reference-workload
      - name: Audit dependencies and write CycloneDX SBOM
        run: uv run pip-audit --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Audit the reference workload's dependencies
        working-directory: examples/reference-workload
        run: uv run pip-audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  infra:
    # The Deployment's Pulumi components and policy pack, offline: Pulumi's mocks, and the pack
    # run over the program's recorded state by the pinned CLI (spec 08 seams 6 and 7). No AWS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install the pinned Pulumi CLI (the SDK's release)
        uses: pulumi/actions@v6
        with:
          pulumi-version: 3.272.0
      - name: Sync the policy pack and the stack from their lockfiles
        run: |
          uv sync --frozen --directory infra/pulumi/aws/policy
          uv sync --frozen --directory infra/pulumi/aws
      - name: Gates (policy pack, then the stack with the real Lambda package)
        env:
          DATA_FINOPS_BUILD_PACKAGE: '1'  # builds the arm64 zip from this checkout (spec 08 seam 8)
        run: uv run --no-project python -m scripts.gates policy stack
      - name: Audit the policy pack's and the stack's dependencies
        run: |
          uv run --directory infra/pulumi/aws/policy pip-audit
          uv run --directory infra/pulumi/aws pip-audit
