name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the PR commit range
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Sync dependencies from committed lockfile
        run: uv sync --extra dev --extra api --extra aws --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src scripts/site
      - run: uv run pytest --cov=data_finops --cov-report=term-missing
      - run: uv run bandit -q -r src scripts/site
      - name: Audit dependencies and write CycloneDX SBOM
        run: uv run pip-audit --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Reference workload tests (offline, Pulumi mocks)
        working-directory: examples/reference-workload
        run: |
          uv sync --frozen
          uv run mypy
          uv run bandit -q -r infra.py __main__.py
          uv run pytest
          uv run pip-audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  infra:
    # The Deployment's Pulumi components and policy pack, offline: Pulumi's mocks, and the pack
    # run over the program's recorded state by the pinned CLI (spec 08 seams 6 and 7). No AWS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install the pinned Pulumi CLI (the SDK's release)
        uses: pulumi/actions@v6
        with:
          pulumi-version: 3.272.0
      - name: Policy pack (unit tests; its environment is the one the CLI runs)
        working-directory: infra/pulumi/aws/policy
        run: |
          uv sync --frozen
          uv run mypy
          uv run bandit -q -r policies.py __main__.py
          uv run pytest
          uv run pip-audit
      - name: Stack (mocks, and the pack over the program's state)
        working-directory: infra/pulumi/aws
        run: |
          uv sync --frozen
          uv run mypy
          uv run bandit -q -r deployment __main__.py
          uv run pytest
          uv run pip-audit
