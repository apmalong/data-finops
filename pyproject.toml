[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"
[project]
name = "data-finops"
version = "0.0.0"
description = "Workload-aware cloud cost attribution (bootstrap)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "pyarrow>=18,<25",
    "pydantic>=2.10,<3",
    "rfc3339-validator>=0.1.4,<0.2",
]
[project.scripts]
data-finops = "data_finops.cli:main"

[project.optional-dependencies]
# The HTTP API and dashboard (spec 06). Exact pins: the newest releases at least two weeks
# old when added (build-vs-reuse register); starlette is pinned because fastapi leaves it open.
api = ["fastapi==0.156.4", "starlette==1.9.0", "uvicorn==0.54.0"]
# The AWS collectors (spec 08; `providers.aws`): the newest boto3 and botocore at least two
# weeks old when added (build-vs-reuse register, #179); mangum serves the API from Lambda (#184).
aws = ["boto3==1.43.118", "botocore==1.43.118", "mangum==0.22.0"]
# Mutation testing of the money path (#243): Linux only, since mutmut needs `fork`. The newest
# release at least two weeks old when added (build-vs-reuse register).
mutation = ["mutmut==3.8.1"]
dev = ["httpx==0.28.1", "pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2", "pip-audit>=2,<3", "pre-commit>=4,<5", "bandit>=1.8,<2", "build>=1,<2", "types-jsonschema>=4.23,<5"]
[tool.hatch.build.targets.wheel]
packages = ["src/data_finops"]
[tool.pytest.ini_options]
# Starlette 1.9 suggests httpx2 for its test client; httpx 0.28.1 is the vetted choice
# (build-vs-reuse register) until httpx2 is reviewed.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
testpaths = ["tests"]
# The repository root, so tests import the dev tooling in scripts/site (spec 07).
pythonpath = ["."]
addopts = "-ra"
[tool.mutmut]
# The money path (AGENTS.md, "Work with AI"). Run by .github/workflows/mutation.yml (#243).
source_paths = ["src/"]
only_mutate = [
    "src/data_finops/attribution/*",
    "src/data_finops/calculation/*",
    "src/data_finops/ledger/*",
    "src/data_finops/billing/*",
    "src/data_finops/providers/athena_billing.py",
]
# The tests read files across the repository, so mutmut's copy in mutants/ needs them too.
also_copy = [
    ".claude/", ".github/", "docs/", "examples/", "fixtures/", "infra/", "schemas/", "scripts/",
    "site/", "third_party/", "AGENTS.md", "GLOSSARY.md", "README.md", "THIRD_PARTY_NOTICES.md",
    "uv.lock",
]
# This test reads the source text for environment variables, and mutants change that text.
pytest_add_cli_args_test_selection = [
    "tests/",
    "--deselect",
    "tests/unit/test_site_exit_codes.py::test_the_page_lists_exactly_the_environment_variables_the_code_reads",
]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:."
# scripts/site is the package scripts.site, never the stdlib site module.
explicit_package_bases = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
# botocore ships no type hints; `providers.aws` types its clients with its own Protocols (#179).
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
