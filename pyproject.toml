[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"
[project]
name = "data-finops"
version = "0.0.0"
description = "Workload-aware cloud cost attribution (bootstrap)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "rfc3339-validator>=0.1.4,<0.2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2", "pip-audit>=2,<3", "pre-commit>=4,<5", "bandit>=1.8,<2", "build>=1,<2"]
[tool.hatch.build.targets.wheel]
packages = ["src/data_finops"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
