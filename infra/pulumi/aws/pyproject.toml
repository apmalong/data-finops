[project]
name = "data-finops-aws-deployment"
version = "0.0.0"
description = "Pulumi Python components that deploy data-finops into one AWS account (spec 08, ADR 0026). Not part of the data_finops package."
requires-python = ">=3.12"
# The Pulumi SDK matches the pinned CLI, the newest release at least two weeks old (build-vs-reuse
# register); pulumi-aws matches the reference workload (owner, M6 design Q23).
dependencies = [
    "pulumi==3.272.0",
    "pulumi-aws==7.52.1",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.14,<2",
    "pip-audit>=2,<3",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# Upstream notices, not this code: the Pulumi SDK makes asyncio futures before any loop runs,
# and pulumi-aws warns on import about its own deprecated V2 S3 classes (none is used here).
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning",
    "ignore::DeprecationWarning:pulumi_aws",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["deployment", "__main__.py", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false  # pulumi.runtime.test is not annotated
