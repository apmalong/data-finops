[project]
name = "data-finops-policy-pack"
version = "0.0.0"
description = "The Deployment's policy pack (spec 08 §Policy pack): its own environment, since pulumi-policy 1.21.0 pins protobuf 5."
requires-python = ">=3.12"
dependencies = [
    "pulumi==3.272.0",
    "pulumi-policy==1.21.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.14,<2",
    "pip-audit>=2,<3",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["policies.py", "__main__.py", "tests"]

[[tool.mypy.overrides]]
module = ["pulumi_policy", "pulumi_policy.*"]
ignore_missing_imports = true
